<svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="700" height="500" fill="#ffffff"/>
  <text x="350" y="32" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Multiplexer IC — Pin Layout (IC 74153 style, Dual 4-to-1 Mux)</text>

  <!-- IC body -->
  <rect x="250" y="80" width="200" height="340" rx="6" fill="#2d2d2d" stroke="#000000" stroke-width="2"/>
  <circle cx="350" cy="100" r="8" fill="#1a1a1a" stroke="#888888" stroke-width="1"/>
  <text x="350" y="255" font-size="16" fill="#f7fafc" text-anchor="middle" transform="rotate(-90 350 255)">74153</text>

  <!-- Left pins 1-8 -->
  <g font-size="12" fill="#1a1a2e">
    <line x1="200" y1="100" x2="250" y2="100" stroke="#1a1a2e" stroke-width="2"/>
    <text x="195" y="104" text-anchor="end">1 1G (Enable)</text>

    <line x1="200" y1="140" x2="250" y2="140" stroke="#1a1a2e" stroke-width="2"/>
    <text x="195" y="144" text-anchor="end">2 B (Select)</text>

    <line x1="200" y1="180" x2="250" y2="180" stroke="#1a1a2e" stroke-width="2"/>
    <text x="195" y="184" text-anchor="end">3 1C3</text>

    <line x1="200" y1="220" x2="250" y2="220" stroke="#1a1a2e" stroke-width="2"/>
    <text x="195" y="224" text-anchor="end">4 1C2</text>

    <line x1="200" y1="260" x2="250" y2="260" stroke="#1a1a2e" stroke-width="2"/>
    <text x="195" y="264" text-anchor="end">5 1C1</text>

    <line x1="200" y1="300" x2="250" y2="300" stroke="#1a1a2e" stroke-width="2"/>
    <text x="195" y="304" text-anchor="end">6 1C0</text>

    <line x1="200" y1="340" x2="250" y2="340" stroke="#1a1a2e" stroke-width="2"/>
    <text x="195" y="344" text-anchor="end">7 1Y (Output)</text>

    <line x1="200" y1="380" x2="250" y2="380" stroke="#1a1a2e" stroke-width="2"/>
    <text x="195" y="384" text-anchor="end">8 GND</text>
  </g>

  <!-- Right pins 9-16 -->
  <g font-size="12" fill="#1a1a2e">
    <line x1="450" y1="380" x2="500" y2="380" stroke="#1a1a2e" stroke-width="2"/>
    <text x="505" y="384">9 2Y (Output)</text>

    <line x1="450" y1="340" x2="500" y2="340" stroke="#1a1a2e" stroke-width="2"/>
    <text x="505" y="344">10 2C0</text>

    <line x1="450" y1="300" x2="500" y2="300" stroke="#1a1a2e" stroke-width="2"/>
    <text x="505" y="304">11 2C1</text>

    <line x1="450" y1="260" x2="500" y2="260" stroke="#1a1a2e" stroke-width="2"/>
    <text x="505" y="264">12 2C2</text>

    <line x1="450" y1="220" x2="500" y2="220" stroke="#1a1a2e" stroke-width="2"/>
    <text x="505" y="224">13 2C3</text>

    <line x1="450" y1="180" x2="500" y2="180" stroke="#1a1a2e" stroke-width="2"/>
    <text x="505" y="184">14 2G (Enable)</text>

    <line x1="450" y1="140" x2="500" y2="140" stroke="#1a1a2e" stroke-width="2"/>
    <text x="505" y="144">15 A (Select)</text>

    <line x1="450" y1="100" x2="500" y2="100" stroke="#1a1a2e" stroke-width="2"/>
    <text x="505" y="104">16 VCC</text>
  </g>

  <text x="350" y="450" font-size="12" text-anchor="middle" fill="#4a5568">1C0–1C3 / 2C0–2C3 = 4 Data inputs of each 4:1 mux section  |  1G / 2G = Active-low enable</text>
  <text x="350" y="470" font-size="12" text-anchor="middle" fill="#4a5568">A, B = Common select lines  |  1Y, 2Y = Multiplexed outputs</text>
</svg>
